plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.53'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        configureEach {
            // 为 JetBrain Runtime 添加的参数，方便热重载
            jvmArgs = [
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    "-XX:+AllowEnhancedClassRedefinition"
            ]
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'terminal.jline', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('run/client')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('run/server')
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('run/gametest')
        }

        data {
            workingDirectory project.file('run/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

sourceSets {
    transformer {
        java.srcDirs = ['src/transformer/java']
        resources.srcDirs = ['src/transformer/resources']
        compileClasspath += sourceSets.main.compileClasspath
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // Registrate
        url "https://maven.tterrag.com/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = 'sponge-repo'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
            includeGroup("com.eliotlash.mclib")
        }
    }
    flatDir {
        dirs "libs", "TouhouLittleMaid/libs"
    }
    mavenLocal()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.5")) {
        jarJar.ranged(it, "[0.3.5,)")
    }
    implementation(jarJar("net.bytebuddy:byte-buddy-agent:1.15.11")) {
        jarJar.ranged(it, "[1.15.11,)")
    }

    implementation fg.deobf("curse.maven:touhou-little-maid-355044:8061847")

    implementation fg.deobf("curse.maven:applied-energistics-2-223794:7148487")
    implementation fg.deobf("curse.maven:guideme-1173950:8204776")


    runtimeOnly fg.deobf("maven.modrinth:caelus:3.2.0+1.20.1-forge")
    runtimeOnly fg.deobf("maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge")
    implementation fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:8680180")
    // ISS 3.16 起把公共代码拆到独立前置 Iron's Lib，缺了它 FML 会直接中止模组加载
    implementation fg.deobf("curse.maven:irons-lib-1492763:8364892")

    implementation fg.deobf("maven.modrinth:ars-nouveau:4.12.7-forge,1.20.1")

    implementation fg.deobf("maven.modrinth:goety:2.5.57.3-forge,1.20.1")

    runtimeOnly fg.deobf("maven.modrinth:patchouli:1.20.1-85-forge")
    implementation fg.deobf("maven.modrinth:psi:1.20.1-1.20.1-102-forge")

    implementation fg.deobf("maven.modrinth:youkaishomecoming:2.7.0-forge,1.20.1")
    compileOnly files("libs/l2serial-1.2.4.jar")
    implementation fg.deobf("maven.modrinth:farmers-delight:1.20.1-1.3.4-forge")
    implementation fg.deobf("maven.modrinth:l2library:2.5.3-forge,1.20.1")
    compileOnly fg.deobf(jarJar("com.tterrag.registrate:Registrate:${registrate_version}")) {
        transitive = false
        jarJar.ranged(it, "[MC1.20-1.3.3,)")
    }

    implementation fg.deobf("maven.modrinth:slashblade-resharped:1.9.65-forge,1.20.1")
    implementation fg.deobf("maven.modrinth:curios:5.14.1+1.20.1-forge")

    implementation fg.deobf("curse.maven:electroblobs-wizardry-redux-1405790:8757420")

    // Optional spell-mod compatibility targets. Keep these unbundled; they are only needed
    // for compiling and local runtime checks when their providers are present.
    compileOnly fg.deobf("curse.maven:sweetmagic-415318:8640582")
    runtimeOnly fg.deobf("curse.maven:sweetmagic-415318:8640582")
    compileOnly fg.deobf("curse.maven:mana-and-artifice-406360:6847805")
    runtimeOnly fg.deobf("curse.maven:mana-and-artifice-406360:6847805")

    compileOnly fg.deobf("curse.maven:jei-238222:8759243")
    runtimeOnly fg.deobf("curse.maven:jei-238222:8759243")
    runtimeOnly fg.deobf("curse.maven:mouse-tweaks-60089:5338457")
    // 5.5.4 的 WindowMixin 注入描述符对不上 1.20.1 的 Window，会 FATAL；保持 5.1.2
    if (!gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['runServer', 'runGameTestServer'] }) {
        runtimeOnly fg.deobf("curse.maven:imblocker-483760:6487340")
        runtimeOnly fg.deobf("maven.modrinth:justenoughcharacters:4.6.11-forge,1.20.1")
    }
    runtimeOnly fg.deobf("maven.modrinth:jade:11.13.3+forge")

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'mod'

    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}",
                "MixinConfigs"          : "maidspell.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

def bundledModJar = tasks.named('jarJar').flatMap { it.archiveFile }

tasks.register('devTransformerJar', Jar) {
    dependsOn tasks.named('transformerClasses')
    archiveClassifier = 'transformer-dev'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(sourceSets.transformer.output) {
        exclude 'META-INF/services/net.minecraftforge.forgespi.locating.IModLocator'
        exclude 'com/github/yimeng261/maidspell/bootstrap/MaidSpellNestedModLocator.class'
    }
    manifest {
        attributes([
                "Implementation-Title": "${project.name} development transformer",
                "Implementation-Version": "${version}",
                "Automatic-Module-Name": "touhou_little_maid_spell.dev_transformer",
                "FMLModType": "LIBRARY"
        ])
    }
}

tasks.register('bundleJar', Jar) {
    dependsOn tasks.named('reobfJarJar'), tasks.named('transformerClasses')
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from sourceSets.transformer.output
    from(bundledModJar) {
        into 'META-INF/maidspell'
        rename { 'maidspell-mod.jar' }
    }
    manifest {
        attributes([
                "Implementation-Title": "${project.name} bootstrap",
                "Implementation-Version": "${version}",
                "Automatic-Module-Name": "touhou_little_maid_spell.bootstrap",
                "FMLModType": "LIBRARY"
        ])
    }
}

def devTransformerJarFile = tasks.named('devTransformerJar').get().archiveFile.get().asFile
def maidSpellEarlyServiceRuntime = files(devTransformerJarFile)

dependencies {
    // ForgeGradle places transformation services on the legacy game library path.
    // Using runtimeOnly also puts the same module on the service layer twice.
    minecraftLibrary maidSpellEarlyServiceRuntime
    minecraftLibrary 'net.bytebuddy:byte-buddy-agent:1.15.11'
}

tasks.configureEach {
    if (name == 'runClient') {
        dependsOn tasks.named('devTransformerJar')
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('bundleJar')
}

// Keep the dependency-bearing mod separate from the early service module.
tasks.named('jarJar') {
    archiveClassifier = 'nested'
}

tasks.register('verifyBundledModJar') {
    group = 'verification'
    description = 'Verifies the bootstrap jar contains a remapped MaidSpell mod and its Mixin refmap.'
    dependsOn tasks.named('bundleJar')
    inputs.file(tasks.named('bundleJar').flatMap { it.archiveFile })

    doLast {
        def bundleFile = tasks.named('bundleJar').get().archiveFile.get().asFile
        def nestedJarBytes
        new java.util.zip.ZipFile(bundleFile).withCloseable { bundle ->
            def nestedEntry = bundle.getEntry('META-INF/maidspell/maidspell-mod.jar')
            if (nestedEntry == null) {
                throw new GradleException("${bundleFile.name} is missing the nested MaidSpell mod jar")
            }
            nestedJarBytes = bundle.getInputStream(nestedEntry).bytes
        }

        boolean hasRefmap = false
        boolean hasRuntimeAgent = false
        boolean hasBootstrapClasses = false
        byte[] livingEntityMixin = null
        new java.util.zip.ZipInputStream(new ByteArrayInputStream(nestedJarBytes)).withCloseable { nestedJar ->
            java.util.zip.ZipEntry entry
            while ((entry = nestedJar.nextEntry) != null) {
                if (entry.name == 'maidspell.refmap.json') {
                    hasRefmap = true
                } else if (entry.name == 'META-INF/jarjar/byte-buddy-agent-1.15.11.jar') {
                    hasRuntimeAgent = true
                } else if (entry.name == 'com/github/yimeng261/maidspell/bootstrap/HurtHeadTransformationService.class') {
                    hasBootstrapClasses = true
                } else if (entry.name == 'com/github/yimeng261/maidspell/mixin/LivingEntityMixin.class') {
                    livingEntityMixin = nestedJar.readAllBytes()
                }
            }
        }

        if (!hasRefmap) {
            throw new GradleException('Nested MaidSpell mod jar is missing maidspell.refmap.json')
        }
        if (!hasRuntimeAgent) {
            throw new GradleException('Nested MaidSpell mod jar is missing the runtime agent')
        }
        if (hasBootstrapClasses) {
            throw new GradleException('Nested MaidSpell mod jar exports the early service package')
        }
        if (livingEntityMixin == null) {
            throw new GradleException('Nested MaidSpell mod jar is missing LivingEntityMixin.class')
        }

        def classConstants = new String(livingEntityMixin, java.nio.charset.StandardCharsets.ISO_8859_1)
        if (!classConstants.contains('m_6234_') || classConstants.contains('removeEffectNoUpdate')) {
            throw new GradleException('Nested LivingEntityMixin contains unremapped Minecraft method names')
        }
    }
}

tasks.register('verifyBootstrapJar') {
    group = 'verification'
    description = 'Verifies the installable jar contains only bootstrap services and a nested mod.'
    dependsOn tasks.named('bundleJar')
    inputs.file(tasks.named('bundleJar').flatMap { it.archiveFile })

    doLast {
        def bootstrapFile = tasks.named('bundleJar').get().archiveFile.get().asFile
        def requiredEntries = [
                'META-INF/services/cpw.mods.modlauncher.api.ITransformationService',
                'META-INF/services/net.minecraftforge.forgespi.locating.IModLocator',
                'com/github/yimeng261/maidspell/bootstrap/HurtHeadTransformationService.class',
                'com/github/yimeng261/maidspell/bootstrap/MaidSpellNestedModLocator.class',
                'META-INF/maidspell/maidspell-mod.jar'
        ]
        new java.util.zip.ZipFile(bootstrapFile).withCloseable { zip ->
            requiredEntries.each { entryName ->
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("${bootstrapFile.name} is missing ${entryName}")
                }
            }
            if (zip.getEntry('com/github/yimeng261/maidspell/coremod/HurtHeadCoremodHooks.class') != null) {
                throw new GradleException("${bootstrapFile.name} exposes game classes to the service layer")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBootstrapJar')
}

tasks.named('check') {
    dependsOn tasks.named('verifyBundledModJar')
}

tasks.configureEach {
    if (name == 'downloadMcpConfig') {
        // ForgeGradle marks this task out-of-date by default; only run it when the cached zip is missing.
        onlyIf { !outputs.files.singleFile.exists() }
    }
}

tasks.withType(JavaCompile).configureEach {
    // Compile Java sources in UTF-8 regardless of the Gradle daemon's encoding.
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-removal']
}

// MixinGradle writes the annotation processor output beside compileJava's
// temporary files. Declare it as an output so deleting the refmap cannot make
// an incremental build silently produce an unlaunchable release jar.
def maidSpellCompileRefmap = layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')
tasks.named('compileJava').configure {
    outputs.file(maidSpellCompileRefmap)
}

tasks.named('jar', Jar).configure {
    doFirst {
        if (!maidSpellCompileRefmap.get().asFile.isFile()) {
            throw new GradleException('Mixin refmap was not generated; refusing to package a jar without maidspell.refmap.json')
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'maidspell.projectDir', projectDir.absolutePath
}

tasks.register('validateResources', Test) {
    group = 'verification'
    description = 'Validates MaidSpell JSON, translations, and optional-mod resource guards.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.github.yimeng261.maidspell.validation.*'
    }
}

mixin {
    add sourceSets.main, "maidspell.refmap.json"

    // 开发环境里必须显式登记这份 config，否则我们的 mixin 一条都不会生效。
    config "maidspell.mixins.json"

    dumpTargetOnFailure true
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
