plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
    id 'net.magicterra.stagewright' version '0.1.0-build.11+1.21.1'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.+'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url = 'https://nexus.gardel.top/repository/maven-releases'
        content { includeGroup 'net.magicterra' }
    }
    maven {
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name "cursemaven"
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://code.redspace.io/releases"
        content {
            includeGroup "io.redspace"
        }
    }
    maven {
        url "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
            includeGroup "mezz.jei"
        }
    }
    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        url "https://maven.theillusivec4.top"
        content {
            includeGroup("top.theillusivec4.curios")
        }
    }
    maven {
        url 'https://maven.blamejared.com'
        content {
            includeGroup("com.hollingsworth.ars_nouveau")
            includeGroup("com.hollingsworth.nuggets")
        }
    }
    maven {
        url "https://maven.minecraftforge.net/"
        content {
            includeGroup("com.github.glitchfiend")
        }
    }
}

base {
    // 打包制品以 mod_id 命名添加版本后缀
    archivesName = "$mod_id-$minecraft_version"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// StageWright 测试场景放在 testmod 源集，不进发布 jar，继承 main 的开发类路径。
// clientTest 是纯 JVM 的 JUnit 源集，通过 worlddriver RPC 附着到 hold 住的客户端做界面测试。
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    clientTest
}

def stagewrightVersion = '0.1.0-build.11+1.21.1'
def worlddriverVersion = '0.1.0-build.5+1.21.1'

// 按拓扑分流：场景 Provider 读 maidspell.test.topology，只注册本拓扑的场景，每个拓扑一份清单
stagewright {
    topologies {
        dedicatedServer {
            runTask = 'runStagewrightDedicatedServer'
            expectFile = file('src/testmod/expected-scenes-dedicatedServer.txt')
        }
        integratedServer {
            runTask = 'runStagewrightIntegratedServer'
            expectFile = file('src/testmod/expected-scenes-integratedServer.txt')
            client = true
        }
        integratedServerShared {
            runTask = 'runStagewrightIntegratedServerShared'
            expectFile = file('src/testmod/expected-scenes-integratedServerShared.txt')
            client = true
        }
    }
}

neoForge {
    // 指定 NeoForge 版本
    version = project.neo_version
    addModdingDependenciesTo sourceSets.testmod

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 这个文件会自动加载
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // 导出混入后的 class 字节码以供分析调试
            systemProperty 'mixin.debug.export', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // StageWright 运行配置：类路径取 testmod 源集，测试框架和 worlddriver 只在这些运行里加载
        stagewrightDedicatedServer {
            server()
            sourceSet = sourceSets.testmod
            gameDirectory = file('run-stagewright-dedicatedServer')
            programArgument '--nogui'
            // 避开本机其它开发服常用的 25565
            programArguments.addAll '--port', '25591'
            systemProperty 'stagewright.autorun', 'true'
            systemProperty 'maidspell.test.topology', 'dedicatedServer'
        }

        // 集成拓扑；共享归隐之地模式的配置由 prepareStagewrightIntegratedServerSharedFiles 写入
        ['integratedServer', 'integratedServerShared'].each { topology ->
            create("stagewright${topology.capitalize()}") {
                client()
                sourceSet = sourceSets.testmod
                gameDirectory = file("run-stagewright-${topology}")
                systemProperty 'stagewright.autorun', 'true'
                // 客户端自动建档进世界；等本地玩家进服后再开跑场景（同时给玩家 op）
                systemProperty 'stagewright.client.world', 'StageWrightClient'
                systemProperty 'stagewright.awaitPlayer', 'true'
                systemProperty 'maidspell.test.topology', topology
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.testmod)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // StageWright 测试框架与 worlddriver 驱动：只进 testmod 类路径，不影响 runClient 和发布
    testmodImplementation "net.magicterra:mc_stagewright-api:${stagewrightVersion}:dev"
    testmodRuntimeOnly "net.magicterra:mc_stagewright-neoforge:${stagewrightVersion}"
    testmodRuntimeOnly "net.magicterra:worlddriver-neoforge:${worlddriverVersion}"
    testmodRuntimeOnly 'dev.architectury:architectury-neoforge:13.0.8'

    // 客户端 JUnit 附着测试
    clientTestImplementation "net.magicterra:mc_stagewright-junit:${stagewrightVersion}"
    clientTestImplementation platform('org.junit:junit-bom:5.11.3')
    clientTestImplementation 'org.junit.jupiter:junit-jupiter'
    clientTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 车万女仆
    implementation("curse.maven:touhou-little-maid-355044:${tlm_curse_version}") {
        exclude group: "maven.modrinth", module: "sodium"
        exclude group: "maven.modrinth", module: "embeddium"
    }
    // Iron 的法术与魔导书
    implementation("io.redspace:irons_spellbooks:${minecraft_version}-${irons_spells_version}")
    // Iron's Lib
    implementation("maven.modrinth:irons-lib:${minecraft_version}-${irons_lib_version}")
    // 新生魔艺
    implementation("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}")
    // PSI
    implementation("curse.maven:psi-241665:${psi_version}")
    // Goety
    implementation("maven.modrinth:goety:${goety_version}")
    // UsefulMagic（弹幕/魔法阵战斗，Kotlin）+ 其前置
    implementation("maven.modrinth:usefulmagic:${usefulmagic_version}")
    implementation("maven.modrinth:cooparticlesapi:${cooparticlesapi_version}")
    implementation("maven.modrinth:kotlin-for-forge:${kotlinforforge_version}")
    // SlashBlade Resharped
    implementation("maven.modrinth:slashblade-resharped:${slashblade_version}")

    // 下面是一些前置
    implementation("vazkii.patchouli:Patchouli:${patchouli_version}")
    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    implementation("top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}")
    implementation("maven.modrinth:jade:${jade_version}")
    runtimeOnly("maven.modrinth:appleskin:${appleskin_version}")
    runtimeOnly("maven.modrinth:farmers-delight:${farmers_delight_version}")
    runtimeOnly("maven.modrinth:playeranimator:${playeranimator_version}")
    runtimeOnly("maven.modrinth:c2me-neoforge:${c2me_version}")
    // 妖怪的归家
    runtimeOnly("maven.modrinth:youkaishomecoming:${youkaishomecoming_version}")
}

// 集成拓扑运行目录的种子文件（Provision 会清空运行目录，之后再写入）：客户端选项跳过首次启动的辅助功能引导页、
// 失焦不暂停；共享归隐之地拓扑另写入关闭私人维度的通用配置（其余配置项由 NeoForge 补默认值）
[
        IntegratedServer      : [:],
        IntegratedServerShared: ['src/testmod/run-config/integratedServerShared': 'config'],
].each { topology, extra ->
    def prepare = tasks.register("prepareStagewright${topology}Files", Copy) {
        into 'run-stagewright-' + topology.uncapitalize()
        from 'src/testmod/run-config/client'
        extra.each { source, target -> from(source) { into target } }
        mustRunAfter "stagewright${topology}Provision"
    }
    tasks.matching { it.name == "runStagewright${topology}" }.configureEach {
        dependsOn prepare
    }
}

// 客户端 JUnit 附着测试：先 ./gradlew stagewrightIntegratedServerHold，再带 TESTKIT_ENDPOINT 跑本任务
tasks.register('clientTest', Test) {
    group = 'verification'
    description = 'Attaches JUnit client tests to a held StageWright integratedServer game'
    testClassesDirs = sourceSets.clientTest.output.classesDirs
    classpath = sourceSets.clientTest.runtimeClasspath
    useJUnitPlatform()
    environment 'TESTKIT_ENDPOINT', System.getenv('TESTKIT_ENDPOINT') ?: ''
    outputs.upToDateWhen { false }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version               : minecraft_version,
            minecraft_version_range         : minecraft_version_range,
            neo_version                     : neo_version,
            neo_version_range               : neo_version_range,
            loader_version_range            : loader_version_range,
            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_license                     : mod_license,
            mod_version                     : mod_version,
            mod_authors                     : mod_authors,
            mod_description                 : mod_description,
            touhou_little_maid_version_range: touhou_little_maid_version_range,
            irons_spells_version_range      : irons_spells_version_range,
            ars_nouveau_version_range       : ars_nouveau_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

createMinecraftArtifacts {
    dependsOn generateModMetadata
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// 让 IDEA 强制下载前置库的源代码，方便开发时查看
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def getChangelogForVersion(String version) {
    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return version
    }

    def lines = changelogFile.readLines()
    def versionHeader = "## ${version}"
    def inVersionSection = false
    def changelog = new StringBuilder()

    for (line in lines) {
        if (line.trim() == versionHeader) {
            inVersionSection = true
            continue
        }
        if (inVersionSection) {
            if (line.trim() == "---") {
                break
            }
            changelog.append(line).append('\n')
        }
    }

    return changelog.toString().trim()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = 'touhou-little-maid-spell'
    // versionNumber = "1.0.0"
    versionType = version_type
    uploadFile = jar
    changelog = getChangelogForVersion(mod_version)
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    dependencies {
        required.project "touhou-little-maid"
    }
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    def mainFile = upload(curseforge_project, jar)
    mainFile.changelog = getChangelogForVersion(mod_version)
    mainFile.releaseType = version_type
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader('neoforge')
    mainFile.addRequirement('touhou-little-maid')
    mainFile.withAdditionalFile(sourcesJar)
}

tasks.register('publishMod') {
    group = 'publishing'
    description = 'Publishes the mod to both Modrinth and CurseForge'
    dependsOn 'modrinth', 'publishCurseForge'
}
